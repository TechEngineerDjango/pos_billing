{% extends "layout.html" %}

{% block content %}
<div class="h-[calc(100vh-4rem)] bg-[#F5F5F7] dark:bg-[#0a0f1c] overflow-y-auto p-6 lg:p-12">
    <div class="max-w-3xl mx-auto">

        <!-- Header -->
        <div class="mb-10 flex justify-between items-end">
            <div>
                <a href="/admin/?tab=customers{% if shop %}&shop_id={{ shop.id }}{% endif %}"
                    class="text-green-500 font-black uppercase tracking-[0.2em] text-[10px] flex items-center gap-2 mb-4 hover:gap-3 transition-all">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7">
                        </path>
                    </svg>
                    Return to CRM Ledger
                </a>
                <h1
                    class="text-4xl font-black text-gray-900 dark:text-white italic tracking-tighter uppercase leading-none">
                    Modify Identity</h1>
                <p class="text-gray-500 dark:text-gray-400 mt-2 font-medium">Updating metadata for <span
                        class="text-gray-900 dark:text-white font-bold">CUST_{{ customer.id }}</span></p>
            </div>
        </div>

        <!-- Edit Card -->
        <div
            class="bg-white dark:bg-slate-900 rounded-[3rem] shadow-2xl p-10 lg:p-12 border border-white/5 relative overflow-hidden">
            <!-- Decorative Accent -->
            <div class="absolute top-0 right-0 w-32 h-32 bg-green-500/10 blur-3xl rounded-full -mr-16 -mt-16"></div>

            <form action="/admin/customer/update/{{ customer.id }}" method="POST" class="space-y-8 relative z-10">
    <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
                <input type="hidden" name="shop_id" value="{{ shop.id }}">

                <div class="grid grid-cols-1 gap-6">
                    <div class="bg-gray-50 dark:bg-white/5 p-6 rounded-3xl border border-white/5">
                        <label class="text-[10px] text-gray-500 font-bold uppercase block mb-1">Legal Registration
                            Name</label>
                        <input type="text" name="name" value="{{ customer.name }}" required
                            class="w-full bg-transparent border-0 text-gray-900 dark:text-white font-black text-2xl p-0 focus:ring-0 placeholder-white/20">
                    </div>

                    <div class="bg-gray-50 dark:bg-white/5 p-6 rounded-3xl border border-white/5">
                        <label class="text-[10px] text-gray-500 font-bold uppercase block mb-1">Global Mobile Station
                            (GMS)</label>
                        <input type="tel" name="phone_number" value="{{ customer.phone_number }}" required
                            class="w-full bg-transparent border-0 text-green-500 font-mono font-black text-2xl p-0 focus:ring-0 tracking-widest">
                        <p class="text-[10px] text-gray-500 font-bold mt-2 uppercase tracking-widest opacity-50">
                            Standardized 10-digit format</p>
                    </div>
                </div>

                <!-- Action Toolbar -->
                <div class="flex flex-col sm:flex-row gap-4 pt-6 border-t border-gray-100 dark:border-white/5">
                    <button type="submit"
                        class="flex-1 bg-green-500 text-white font-black uppercase tracking-widest py-5 rounded-[2rem] hover:bg-green-600 transition-all shadow-xl shadow-green-500/20 text-sm">
                        Synchronize Data
                    </button>
                    <a href="/admin/?tab=customers{% if shop %}&shop_id={{ shop.id }}{% endif %}"
                        class="flex-1 bg-gray-100 dark:bg-white/5 text-gray-500 dark:text-gray-400 font-black uppercase tracking-widest py-5 rounded-[2rem] hover:bg-gray-200 dark:hover:bg-white/10 transition-all text-center text-sm border border-transparent dark:border-white/5">
                        Abort Mission
                    </a>
                </div>

            </form>
        </div>

    </div>
</div>
{% endblock %}
