{% extends "admin/base_admin.html" %}

{% block admin_content %}
<div class="max-w-6xl mx-auto space-y-8">

    <!-- Header -->
    <div class="flex justify-between items-end">
        <div>
            <h1 class="text-3xl font-bold text-white logo-font">Customers</h1>
            <p class="text-gray-400 mt-1">Manage your customer database.</p>
        </div>
    </div>

    <!-- Customer Management -->
    <div class="bg-slate-800/50 backdrop-blur-xl border border-white/10 p-6 rounded-2xl shadow-xl">
        <h2 class="text-xl font-bold text-white mb-6 flex items-center gap-2">
            <span class="p-2 bg-green-500/10 rounded-lg text-green-400">👥</span> Customer List
        </h2>

        <!-- Add Customer Form -->
        <form action="/admin/customer/add" method="POST"
            class="mb-6 flex gap-3 p-4 bg-slate-900/50 rounded-xl border border-white/5 items-center">
            <input type="text" name="name" placeholder="Customer Name"
                class="bg-slate-800 border border-white/10 rounded-lg px-3 py-2 text-white placeholder-gray-500 flex-1 focus:ring-2 focus:ring-green-500 focus:outline-none"
                required>
            <input type="tel" name="phone_number" placeholder="Phone Number"
                class="bg-slate-800 border border-white/10 rounded-lg px-3 py-2 text-white placeholder-gray-500 w-48 focus:ring-2 focus:ring-green-500 focus:outline-none"
                required>
            <button type="submit"
                class="bg-green-600 hover:bg-green-500 text-white p-2 rounded-lg transition-colors flex items-center justify-center">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
            </button>
        </form>

        <div class="overflow-y-auto max-h-[600px] pr-2 custom-scrollbar">
            <table class="w-full text-left border-collapse">
                <thead class="bg-slate-900/80 sticky top-0 backdrop-blur-sm">
                    <tr class="text-gray-400 text-xs uppercase tracking-wider">
                        <th class="p-3 font-medium">Name</th>
                        <th class="p-3 font-medium">Phone</th>
                        <th class="p-3 font-medium text-right">Action</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-white/5">
                    {% for customer in customers %}
                    <tr class="group hover:bg-white/5 transition-colors">
                        <form action="/admin/customer/update/{{ customer.id }}" method="POST" class="contents">
    <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
                            <td class="p-3">
                                <input type="text" name="name" value="{{ customer.name }}"
                                    class="w-full bg-slate-800 border border-white/10 rounded px-2 py-1 text-gray-200 font-medium text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            </td>
                            <td class="p-3">
                                <input type="tel" name="phone_number" value="{{ customer.phone_number }}"
                                    class="w-full bg-slate-800 border border-white/10 rounded px-2 py-1 text-gray-400 text-sm font-mono focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            </td>
                            <td class="p-3 text-right flex gap-1 justify-end">
                                <button type="submit"
                                    class="text-green-500 hover:text-green-400 p-1 hover:bg-green-500/10 rounded"
                                    title="Save">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M5 13l4 4L19 7"></path>
                                    </svg>
                                </button>
                        </form>
                        <form action="/admin/customer/delete/{{ customer.id }}" method="POST"
                            onsubmit="return confirm('Delete customer?');" class="inline">
                            <button
                                class="text-gray-500 hover:text-red-400 transition-colors p-1 hover:bg-red-500/10 rounded">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
                                    </path>
                                </svg>
                            </button>
                        </form>
                        </td>
                    </tr>
                    {% endfor %}
                    {% if not customers %}
                    <tr>
                        <td colspan="3" class="p-8 text-center text-gray-500">
                            No customers found. Add your first customer!
                        </td>
                    </tr>
                    {% endif %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
