{% extends "layout.html" %}

{% block title %}Change Password - BurgerPOS{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-12 px-4">
    <div class="bg-slate-900 border border-white/10 rounded-2xl shadow-2xl overflow-hidden">
        <div class="p-8">
            <div class="flex items-center gap-3 mb-8">
                <div class="w-12 h-12 bg-primary/10 rounded-xl flex items-center justify-center text-2xl">
                    <i class="bi bi-key-fill"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-white logo-font">Security Settings</h1>
                    <p class="text-gray-400 text-sm">Update your account password</p>
                </div>
            </div>

            <form action="/auth/change-password" method="POST" class="space-y-6">
                <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
                
                {% if error %}
                <div class="bg-red-500/10 border border-red-500/50 text-red-400 p-4 rounded-xl text-sm flex items-start gap-3 animate-shake">
                    <span class="mt-0.5"><i class="bi bi-exclamation-triangle-fill"></i></span>
                    <span>{{ error }}</span>
                </div>
                {% endif %}

                <div class="space-y-2">
                    <label class="text-sm font-medium text-gray-300 ml-1">Current Password</label>
                    <div class="relative">
                        <input type="password" name="current_password" required
                            class="w-full bg-slate-800 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all pl-11">
                        <div class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500">
                            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                        </div>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-medium text-gray-300 ml-1">New Password</label>
                    <div class="relative">
                        <input type="password" name="new_password" id="new_password" required
                            pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[!@#$%^&*()_+\-=\[\]{};':\\|,.<>\/?]).{8,}"
                            title="Must contain at least one number and one uppercase and lowercase letter, one special character, and at least 8 or more characters"
                            class="w-full bg-slate-800 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all pl-11">
                        <div class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500">
                            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
                            </svg>
                        </div>
                    </div>
                    <p class="text-[10px] text-gray-400 ml-1 leading-relaxed opacity-70">
                        Security Policy: 8+ chars, uppercase, lowercase, number, & special character.
                    </p>
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-medium text-gray-300 ml-1">Confirm New Password</label>
                    <div class="relative">
                        <input type="password" name="confirm_password" id="confirm_password" required
                            class="w-full bg-slate-800 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all pl-11">
                        <div class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500">
                            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                            </svg>
                        </div>
                    </div>
                </div>

                <div class="pt-4 space-y-3">
                    <button type="submit"
                        class="w-full bg-primary hover:bg-orange-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-orange-500/20 transition-all active:scale-[0.98] flex items-center justify-center gap-3 group">
                        <span>Update Password</span>
                        <svg class="w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6" />
                        </svg>
                    </button>
                    
                    <a href="javascript:history.back()" class="block text-center text-gray-400 hover:text-white text-sm transition-colors py-2">
                        Go Back
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // Client-side confirmation check
    document.querySelector('form').addEventListener('submit', function(e) {
        const newPw = document.getElementById('new_password').value;
        const confirmPw = document.getElementById('confirm_password').value;
        if (newPw !== confirmPw) {
            e.preventDefault();
            alert('New passwords do not match!');
        }
    });
</script>

<style>
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-4px); }
        75% { transform: translateX(4px); }
    }
    .animate-shake {
        animation: shake 0.2s ease-in-out 0s 2;
    }
</style>
{% endblock %}
